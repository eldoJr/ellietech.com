<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER - Spatial Surrealism</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --accent: #e0e7ff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #020205;
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            outline: none;
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #020205 100%);
            z-index: -1;
        }

        /* Spatial UI Components */
        .overlay {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            pointer-events: none;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .logo {
            font-weight: 300;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .hero-text {
            max-width: 600px;
            pointer-events: auto;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 200;
            line-height: 0.9;
            margin-bottom: 2rem;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 12px;
            display: inline-flex;
            flex-direction: column;
            gap: 1rem;
            transform: translateZ(50px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-card p {
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }

        .cta-button {
            background: white;
            color: black;
            border: none;
            padding: 1rem 2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            width: fit-content;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .cta-button:hover {
            transform: scale(1.05) translateY(-2px);
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .stats {
            display: flex;
            gap: 4rem;
        }

        .stat-item .label {
            display: block;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 0.5rem;
        }

        .stat-item .value {
            font-size: 1.2rem;
            font-weight: 300;
        }

        .grain {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            opacity: 0.04;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%" height="100%" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .cursor {
            width: 20px;
            height: 20px;
            border: 1px solid white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="cursor" id="cursor"></div>
    <div class="gradient-bg"></div>
    <canvas id="webgl-canvas"></canvas>

    <main class="overlay">
        <nav>
            <div class="logo">Aether</div>
            <div class="nav-links">
                <a href="#">Dimension</a>
                <a href="#">Synthesis</a>
                <a href="#">Neural</a>
            </div>
        </nav>

        <div class="hero-text">
            <h1>Ethereal<br>Spatiality</h1>
            <div class="glass-card">
                <p>Navigating the intersection of organic form and digital synthesis. Experience the next evolution of immersive spatial interfaces.</p>
                <button class="cta-button">Initialize Protocol</button>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="stats">
                <div class="stat-item">
                    <span class="label">Frequency</span>
                    <span class="value">432.12 Hz</span>
                </div>
                <div class="stat-item">
                    <span class="label">Depth</span>
                    <span class="value">0.887ms</span>
                </div>
            </div>
            <div class="logo" style="font-size: 0.6rem;">© 2024 Synthesis Lab</div>
        </div>
    </main>

    <script>
        // --- WebGL 3D Logic ---
        let scene, camera, renderer, object, sphere, clock;
        const canvas = document.querySelector('#webgl-canvas');

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x7000ff, 2);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00d1ff, 2);
            pointLight2.position.set(-5, -5, 5);
            scene.add(pointLight2);

            // Abstract Glass Shape
            const geometry = new THREE.IcosahedronGeometry(1.5, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                metalness: 0.1,
                roughness: 0.05,
                transmission: 0.95,
                thickness: 1.5,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                ior: 1.5,
                reflectivity: 0.8,
                iridescence: 0.3,
                iridescenceIOR: 1.8
            });

            object = new THREE.Mesh(geometry, material);
            scene.add(object);

            clock = new THREE.Clock();
            animate();
        }

        // Noise-like vertex displacement
        function updateVertices(time) {
            const positionAttribute = object.geometry.getAttribute('position');
            const vertex = new THREE.Vector3();

            for (let i = 0; i < positionAttribute.count; i++) {
                vertex.fromBufferAttribute(positionAttribute, i);
                
                // Create ripple effect
                const wave = Math.sin(vertex.x * 1.5 + time) * 
                             Math.cos(vertex.y * 1.5 + time) * 
                             Math.sin(vertex.z * 1.5 + time) * 0.15;
                
                vertex.normalize().multiplyScalar(1.5 + wave);
                positionAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
            }
            positionAttribute.needsUpdate = true;
            object.geometry.computeVertexNormals();
        }

        function animate() {
            const time = clock.getElapsedTime() * 0.5;
            
            updateVertices(time);
            
            object.rotation.y = time * 0.2;
            object.rotation.z = time * 0.1;

            // Subtle floating movement
            object.position.y = Math.sin(time) * 0.1;

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- Interactivity ---
        const cursor = document.getElementById('cursor');
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;

            // Move custom cursor
            gsap.to(cursor, {
                x: e.clientX - 10,
                y: e.clientY - 10,
                duration: 0.3
            });

            // Parallax 3D shape
            gsap.to(object.rotation, {
                x: mouseY * 0.5,
                y: mouseX * 0.5,
                duration: 2,
                ease: "power2.out"
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // CTA Hover Effect
        const cta = document.querySelector('.cta-button');
        cta.addEventListener('mouseenter', () => {
            gsap.to(object.material, { transmission: 0.3, roughness: 0.5, duration: 0.5 });
        });
        cta.addEventListener('mouseleave', () => {
            gsap.to(object.material, { transmission: 0.95, roughness: 0.05, duration: 0.5 });
        });

        init();
    </script>
</body>
</html>
